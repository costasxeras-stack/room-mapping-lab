# v0.1.0 (data job)
# Pulls room names and LiteAPI's room mapping from the LiteAPI sandbox into data/live.json.
# Needs the LITEAPI_KEY repository secret. Runs on demand, weekly, and when this file or the script changes.
name: Fetch LiteAPI data

on:
  workflow_dispatch:
  # Weekly schedule paused on 23 Nov 2026 to keep the demo numbers stable. Re-add: schedule: - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: ["scripts/fetch_liteapi.py", ".github/workflows/fetch.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
        run: python scripts/fetch_liteapi.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "data: LiteAPI sandbox pull $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
